name: Quotes
options:
  bundleIdPrefix: com.personal
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.0.0

targets:
  Quotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Quotes
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "" 
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: DailyQuoteWidget
        embed: true
      - package: Supabase
      - package: GoogleSignIn

  DailyQuoteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: DailyQuoteWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: YES
    dependencies:
      - framework: WidgetKit.framework
        implicit: true
      - framework: SwiftUI.framework
        implicit: true
