name: Quotes
options:
  bundleIdPrefix: com.personal
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

targets:
  Quotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    entitlements:
      path: Quotes.entitlements
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_NAME: Quotes
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "" 
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: DailyQuoteWidget

  DailyQuoteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    entitlements:
      path: Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
