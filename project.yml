name: Quotes
options:
  bundleIdPrefix: com.personal
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

targets:
  Quotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    entitlements:
      path: Quotes.entitlements
    info:
      path: QuotesInfo.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: Quotes
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "" 
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: DailyQuoteWidget
        embed: true

  DailyQuoteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    entitlements:
      path: Widget.entitlements
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: "Quotes"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.quotes.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
