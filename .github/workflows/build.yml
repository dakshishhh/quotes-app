name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Secrets.swift
        run: |
          cat <<EOF > Sources/Services/Secrets.swift
          import Foundation
          enum Secrets {
              static let supabaseUrl = "\${{ secrets.SUPABASE_URL }}"
              static let supabaseKey = "\${{ secrets.SUPABASE_KEY }}"
          }
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Echo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Echo.xcarchive/Products/Applications/Echo.app Payload/
          zip -r Echo.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-App
          path: Echo.ipa
